name: Build FUN60 Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fun60-windows.yml"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Fetch inspected HallJoy base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a510933c35b8a72b5b0adc74da05444cc4b0cf8a
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply and verify exact FUN60 patch
        shell: python
        run: |
          import base64, hashlib, json, pathlib, subprocess
          patch = base64.b64decode("", validate=True)
          assert hashlib.sha256(patch).hexdigest() == "f230c0f2fd6df65defdf44e3ec5cb9ac87bd25add05a3fe371430709a976190e", "Patch digest mismatch"
          path = pathlib.Path("FUN60-2304.patch")
          path.write_bytes(patch)
          subprocess.run(["git", "apply", "--check", str(path)], check=True)
          subprocess.run(["git", "apply", str(path)], check=True)
          expected = json.loads("{\"README.md\": \"d3f8b48b85d54389c3bed5b2a53d526dbadc8b4d779c11a2379b2594d88652b6\", \"docs/SUPPORTED_HARDWARE.md\": \"79e2cd4bc12cea9abd109aa3e6b38250bf82f58d74183205d445d1bbbf01660c\", \"docs/current/FUN60_PRO_2304_2026-10-05.md\": \"fccfc246cd5a52dd1d68e8935cce434a9add0f11807099d1b5e45b3c9c6d34e9\", \"docs/current/OWNER_CONTEXT.md\": \"ba71fdb35e30f1ddd69e6c5606839309d8ad41dfafa22905618a64650f6f5a0d\", \"docs/research/usb-identity-audit/fun60-2304.json\": \"49d507ff65f9fb52e3258d81825c72e18bfb4f0a71e70f5ae51dcb1bcd51701d\", \"src/HallJoyProject/HallJoy/HallJoy.vcxproj\": \"3267fadabbc88c254f355b8dc13566d4f044f3763739fec0b7096a7ee7a3cf13\", \"src/HallJoyProject/HallJoy/HallJoy.vcxproj.filters\": \"97a4c757be512b668fb6a18f815a9a3856283cf2b5108dea185e15f9652b0d75\", \"src/HallJoyProject/HallJoy/rongyuan_fun60_revision.h\": \"f006916eb50453b1df0f1f36a80c06309fe61a5f0304edd6e270165777e8ef6a\", \"src/HallJoyProject/HallJoy/rongyuan_stream_backend.cpp\": \"356f028b4c69623119db39bf06ddfd1a3180118729c37bcda3011bfc5563e049\", \"src/HallJoyProject/tests/rongyuan_stream_protocol_test.cpp\": \"d01f9cc50ffe3c622908ec2e1871dfe605b9717a77d45dff004c4960b87db272\", \"tools/audit_keyboard_identities.py\": \"e2d0ca3a51e1155933711fc4936db2414e855b3de0da1ab5356966bb17cd1c4a\"}")
          for name, sha in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == sha, name
          print("FUN60 patch applied; all 11 resulting file hashes verified")
      - name: Add FUN60 assignment diagnostics
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/HallJoyProject/HallJoy/rongyuan_stream_backend.cpp")
          data = p.read_bytes()
          needle = b'    SupportLog_Event("rongyuan.fun60_default_map_rejected",s.model->board,'
          assert data.count(needle) == 1
          diagnostic = """    // Static assignment structure only: no key codes, macros or input data.
              static std::atomic<bool> reported{false};
              if (!reported.exchange(true)) {
                unsigned mismatches = 0;
                for (unsigned slot = 0; slot < 128; ++slot) {
                  const auto expected = mg::Decode(s.model->matrix.data() + slot * 4);
                  const auto actual = mg::Decode(assigned.data() + slot * 4);
                  const bool mismatch = expected == 0x409 ? (actual && actual != 0x409) : actual != expected;
                  if (!mismatch) continue;
                  ++mismatches;
                  const unsigned expectedKind = !expected ? 0 : expected == 0x409 ? 2 : 1;
                  const unsigned actualKind = !actual ? 0 : actual == 0x409 ? 2 : 1;
                  SupportLog_Event("rongyuan.fun60_map_mismatch_slot", slot,
                                   SupportLog_Data(expectedKind * 4 + actualKind));
                }
                SupportLog_Event("rongyuan.fun60_map_mismatch_count", mismatches);
              }
          """.replace("\n", "\r\n").encode()
          p.write_bytes(data.replace(needle, diagnostic + needle))
      - name: Full Windows build and release checks
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          where clang++
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build.ps1
          if errorlevel 1 exit /b 1
      - name: Upload patched Windows EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HallJoy-FUN60-Windows
          retention-days: 14
          if-no-files-found: error
          path: |
            build/bin/Release/x64/HallJoy.exe
            build/bin/Release/x64/dependency-lock.json
            build/bin/Release/x64/THIRD_PARTY_NOTICES.md
            build/bin/Release/x64/LICENSE
            build/bin/Release/x64/SHA256SUMS.txt
