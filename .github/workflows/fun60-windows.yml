name: Build FUN60 Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/fun60-windows.yml"]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Fetch inspected HallJoy base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a510933c35b8a72b5b0adc74da05444cc4b0cf8a
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Apply and verify exact FUN60 patch
        shell: python
        run: |
          import base64, hashlib, json, pathlib, subprocess
          patch = base64.b64decode("", validate=True)
          assert hashlib.sha256(patch).hexdigest() == "9f4f07500fc86a4524073ffe8e069c2c8d13ccb2d9079a8d16d1f13759d11b95", "Patch digest mismatch"
          path = pathlib.Path("FUN60-2304.patch")
          path.write_bytes(patch)
          subprocess.run(["git", "apply", "--check", str(path)], check=True)
          subprocess.run(["git", "apply", str(path)], check=True)
          expected = json.loads("{\"README.md\": \"94c8831514dc00745870671ae622b28581532f2437efb012b0971fa61891f963\", \"docs/SUPPORTED_HARDWARE.md\": \"ef4c4ebb37ca9e28d7c1f04b41c2ca03a26afdc094b249d2aff3cd781f57ac2f\", \"docs/current/FUN60_PRO_2304_2026-10-05.md\": \"5dc7a6f3f980d8d087d1f7f854a5a97c62fe6e73d41ef362db8ea958fa565adb\", \"docs/current/OWNER_CONTEXT.md\": \"af3d35d0890ab3ecc4f394f348339cc9685e09c8446a7598b337a916c0246cdc\", \"docs/research/usb-identity-audit/fun60-2304.json\": \"49d507ff65f9fb52e3258d81825c72e18bfb4f0a71e70f5ae51dcb1bcd51701d\", \"src/HallJoyProject/HallJoy/HallJoy.vcxproj\": \"3267fadabbc88c254f355b8dc13566d4f044f3763739fec0b7096a7ee7a3cf13\", \"src/HallJoyProject/HallJoy/HallJoy.vcxproj.filters\": \"97a4c757be512b668fb6a18f815a9a3856283cf2b5108dea185e15f9652b0d75\", \"src/HallJoyProject/HallJoy/rongyuan_fun60_revision.h\": \"c68695ab926ee1c8b73a4a74d817c85c20602c1d675764403b52c4c4b160751a\", \"src/HallJoyProject/HallJoy/rongyuan_stream_backend.cpp\": \"0bd3aa0a4c3b760694a2652044a7c0d64ca736456959d83bc24e9595d2c5ecfa\", \"src/HallJoyProject/tests/rongyuan_stream_protocol_test.cpp\": \"1dfbf97c7c4050ffa85add83c0c8c672ce51ad65fdbd083014f7acb9d334932f\", \"tools/audit_keyboard_identities.py\": \"e2d0ca3a51e1155933711fc4936db2414e855b3de0da1ab5356966bb17cd1c4a\"}")
          for name, sha in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == sha, name
          print("FUN60 patch applied; all 11 resulting file hashes verified")
      - name: Full Windows build and release checks
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b 1
          set "PATH=C:\Program Files\LLVM\bin;%PATH%"
          where clang++
          if errorlevel 1 exit /b 1
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build.ps1
          if errorlevel 1 exit /b 1
      - name: Upload patched Windows EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HallJoy-FUN60-Windows
          retention-days: 14
          if-no-files-found: error
          path: |
            build/bin/Release/x64/HallJoy.exe
            build/bin/Release/x64/dependency-lock.json
            build/bin/Release/x64/THIRD_PARTY_NOTICES.md
            build/bin/Release/x64/LICENSE
            build/bin/Release/x64/SHA256SUMS.txt
